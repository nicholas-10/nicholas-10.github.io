<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Get in touch with Nicholas Axel Tanujaya.">
  <title>Nicholas — Get in touch</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --text: #e9e8e5;
      --muted: #a09f9b;
      --line: #30302e;
      --accent: #c9c8c2;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --width: 1080px;
      --page-gutter: clamp(20px, 5vw, 48px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .wrap { width: min(var(--width), calc(100% - var(--page-gutter) - var(--page-gutter))); margin: 0 auto; }
    .site-header { position: sticky; top: 0; z-index: 5; background: rgb(18 18 18 / 92%); backdrop-filter: blur(16px); border-bottom: 1px solid rgb(255 255 255 / 7%); }
    .nav-row { position: relative; height: 76px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 650; letter-spacing: -.02em; }
    .nav-links { display: flex; align-items: center; gap: 34px; }
    .nav-links a { color: var(--muted); font-size: 13px; transition: color .2s ease; }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--text); }
    .nav-links .contact-link { color: var(--text); }
    .menu-toggle { display: none; color: var(--text); background: none; border: 0; padding: 8px; font: inherit; }
    .contact-main { min-height: calc(100vh - 77px); padding-top: clamp(100px, 18vh, 170px); }
    h1 { margin: 0 0 18px; font-size: clamp(31px, 4vw, 45px); font-weight: 450; line-height: 1.14; letter-spacing: -.045em; }
    .contact-note { max-width: 560px; margin: 0; color: var(--muted); font-size: 13px; }
    .contact-links { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 22px; }
    .text-link { display: inline-flex; align-items: center; gap: 9px; color: var(--text); font-size: 13px; font-weight: 600; }
    .social-link { display: inline-grid; width: 24px; height: 24px; place-items: center; color: var(--muted); transition: color .2s ease; }
    .social-link:hover { color: var(--text); }
    .social-link svg { display: block; width: 21px; height: 21px; fill: currentColor; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 760px) {
      :root { --page-gutter: 20px; }
      .nav-row { height: 67px; }
      .menu-toggle { display: block; cursor: pointer; font-size: 12px; }
      .nav-links { display: none; position: absolute; top: 66px; left: 0; right: 0; padding: 16px 20px 22px; flex-direction: column; align-items: flex-start; gap: 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
      .nav-links.is-open { display: flex; }
      .nav-links a { font-size: 14px; }
      .contact-main { padding-top: 92px; }
    }
    @media (min-width: 761px) and (max-width: 960px) { .nav-links { gap: 18px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-row">
      <a class="brand" href="index.html#home" aria-label="Home"><span data-site-name>Nicholas</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="nav-links" id="site-nav" aria-label="Main navigation">
        <a href="index.html#home">Home</a>
        <a href="index.html#publications">Publications</a>
        <a href="index.html#experience">Experience</a>
        <a href="index.html#projects">Projects</a>
        <a class="contact-link" href="contact.html" aria-current="page">Get in touch ↗</a>
      </nav>
    </div>
  </header>

  <main class="wrap contact-main">
    <h1>Get in touch</h1>
    <p class="contact-note" data-bio-contact-note>For research, collaboration, or inquiries.</p>
    <div class="contact-links">
      <a class="text-link" data-bio-email aria-label="Email Nicholas Axel Tanujaya"><span data-email-text>Loading email…</span><span aria-hidden="true">↗</span></a>
      <a class="social-link" data-social-link="linkedin" aria-label="LinkedIn" title="LinkedIn" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.78C.8 0 0 .77 0 1.73v20.54C0 23.23.8 24 1.78 24h20.44c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
        <span class="visually-hidden">LinkedIn</span>
      </a>
      <a class="social-link" data-social-link="googleScholar" aria-label="Google Scholar" title="Google Scholar" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3Zm-6 9.27V17c0 2.21 2.69 4 6 4s6-1.79 6-4v-4.73l-6 3.27-6-3.27Z"/></svg>
        <span class="visually-hidden">Google Scholar</span>
      </a>
    </div>
  </main>
  <script src="contact.js?v=2" defer></script>
</body>
</html>
