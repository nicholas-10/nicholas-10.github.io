<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Research, projects, and publications.">
  <title>Researcher — Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --text: #e9e8e5;
      --muted: #a09f9b;
      --line: #30302e;
      --accent: #c9c8c2;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --width: 1080px;
      --page-gutter: clamp(20px, 5vw, 48px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 100px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.65 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .wrap { width: min(var(--width), calc(100% - var(--page-gutter) - var(--page-gutter))); margin: 0 auto; }
    .site-header {
      position: sticky; top: 0; z-index: 5;
      background: rgb(18 18 18 / 92%); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgb(255 255 255 / 7%);
    }
    .nav-row { height: 76px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 650; letter-spacing: -.02em; }
    .nav-links { display: flex; align-items: center; gap: 34px; }
    .nav-links a { color: var(--muted); font-size: 13px; transition: color .2s ease; }
    .nav-links a:hover, .nav-links a[aria-current="location"] { color: var(--text); }
    .nav-links .contact-link { color: var(--text); }
    .menu-toggle { display: none; color: var(--text); background: none; border: 0; padding: 8px; font: inherit; }
    main { overflow: hidden; }
    .hero { padding: 112px 0 86px; position: relative; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 810px; margin-bottom: 25px; font-size: clamp(31px, 4vw, 45px); font-weight: 450; line-height: 1.14; letter-spacing: -.045em; }
    h1 em { color: var(--text); font-family: var(--serif); font-weight: 400; }
    .hero-copy { max-width: 535px; margin: 0; color: #b8b7b3; font-size: 17px; line-height: 1.8; }
    .hero-copy p { margin: 0 0 1em; }
    .hero-copy p:last-child { margin-bottom: 0; }
    .hero-intro-row.has-portrait { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 280px); align-items: center; gap: clamp(32px, 6vw, 72px); width: 100%; }
    .hero-intro-row.has-portrait .hero-copy { max-width: none; }
    .hero-portrait { justify-self: end; width: 100%; max-width: 280px; aspect-ratio: 4 / 5; margin: 0; overflow: hidden; border: 1px solid var(--line); background: #191918; }
    .hero-portrait[hidden] { display: none; }
    .hero-portrait img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .text-link { display: inline-flex; align-items: center; gap: 9px; color: var(--text); font-size: 13px; font-weight: 600; }
    .rule { height: 1px; background: var(--line); }
    section { scroll-margin-top: 96px; }
    .section { padding: clamp(58px, 8vw, 86px) 0; }
    .section-heading { margin-bottom: 36px; }
    .publication-note { width: fit-content; margin: 10px 0 0; padding: 7px 11px; border-left: 2px solid var(--accent); background: rgb(255 255 255 / 3%); color: var(--text); font-size: 12px; }
    h2 { margin: 0; font-size: clamp(31px, 4vw, 45px); font-weight: 450; line-height: 1.14; letter-spacing: -.045em; }
    .timeline { border-top: 1px solid var(--line); }
    .experience-group + .experience-group { margin-top: 34px; }
    .experience-subheading { margin: 0 0 14px; font-size: 16px; font-weight: 550; letter-spacing: -.02em; }
    .timeline-item { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(0, 2fr); gap: clamp(20px, 4vw, 34px); padding: 23px 0; border-bottom: 1px solid var(--line); }
    .timeline > .data-status { padding: 16px 0; border-bottom: 1px solid var(--line); }
    .date { color: var(--muted); font-size: 12px; }
    .role-title { margin: 0 0 4px; font-size: 16px; font-weight: 570; letter-spacing: -.02em; }
    .role-place { margin: 0; color: var(--muted); font-size: 13px; }
    .project-grid { border-top: 1px solid var(--line); }
    .project-card { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 clamp(12px, 3vw, 24px); padding: 22px 0; border-bottom: 1px solid var(--line); }
    .project-meta { grid-column: 1; grid-row: 1 / span 3; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .project-card h3 { grid-column: 2; margin: 0 0 5px; font-size: 19px; font-weight: 500; letter-spacing: -.035em; }
    .project-card p { grid-column: 2; max-width: 760px; margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 14px; }
    .tag { padding: 0; border: 0; color: var(--muted); font-size: 10px; }
    .publication-list { border-top: 1px solid var(--line); }
    .publication { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: clamp(12px, 3vw, 24px); align-items: start; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .publication > div { min-width: 0; }
    .pub-year { color: var(--muted); font-size: 12px; }
    .pub-type { display: block; margin-bottom: 3px; color: var(--muted); font: 600 10px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .pub-title { margin: 0 0 5px; font-family: var(--serif); font-size: 19px; font-weight: 400; line-height: 1.35; }
    .pub-title a:hover { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .pub-details { margin: 0; color: var(--muted); font-size: 12px; }
    .pub-details strong { color: var(--text); font-weight: 700; }
    .pub-venue { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .pub-venue strong { color: var(--text); font-weight: 700; }
    .pub-abstract { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .pub-abstract summary { width: fit-content; color: var(--text); cursor: pointer; }
    .pub-abstract p { max-width: 760px; margin: 10px 0 0; }
    .pub-links { display: flex; flex-wrap: wrap; gap: 5px 14px; }
    .pub-link { color: var(--text); font-size: 12px; white-space: nowrap; }
    footer { padding: 20px 0 27px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .footer-row { display: flex; justify-content: space-between; gap: 20px; }
    .data-status { margin: 0; color: var(--muted); font-size: 13px; }
    @media (max-width: 760px) {
      :root { --page-gutter: 20px; }
      .nav-row { height: 67px; }
      .menu-toggle { display: block; cursor: pointer; font-size: 12px; }
      .nav-links { display: none; position: absolute; top: 66px; left: 0; right: 0; padding: 16px 20px 22px; flex-direction: column; align-items: flex-start; gap: 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
      .nav-links.is-open { display: flex; }
      .nav-links a { font-size: 14px; }
      .hero { padding: 76px 0 60px; }
      .hero h1 br, .section-heading h2 br { display: none; }
      .hero-intro-row.has-portrait { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .hero-portrait { justify-self: start; width: min(100%, 230px); }
      .section { padding: 60px 0; }
      .timeline-item { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .section-heading { margin-bottom: 30px; }
      .project-card { grid-template-columns: 48px minmax(0, 1fr); gap: 0 14px; }
      .publication { grid-template-columns: 48px minmax(0, 1fr); gap: 9px 14px; }
      .pub-links { grid-column: 2; }
      .footer-row { flex-wrap: wrap; }
    }
    @media (min-width: 761px) and (max-width: 960px) {
      .nav-links { gap: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-row">
      <a class="brand" href="#home" aria-label="Home"><span data-site-name></span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="nav-links" id="site-nav" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#publications">Publications</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a class="contact-link" href="contact.html">Get in touch ↗</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="wrap hero" id="home">
      <h1 data-bio-headline></h1>
      <div class="hero-intro-row">
        <div class="hero-copy" data-bio-introduction><p>Loading profile…</p></div>
        <figure class="hero-portrait" data-bio-portrait hidden><img alt=""></figure>
      </div>
    </section>

    <div class="wrap"><div class="rule"></div></div>

    <section class="wrap section" id="publications">
      <div class="section-heading">
        <h2>Selected Publications</h2>
        <p class="publication-note"><strong class="author-order-mark" aria-label="alpha">(α)</strong> is used to denote alphabetical ordering.</p>
      </div>
      <div class="publication-list" id="publication-list" aria-live="polite"><p class="data-status">Loading publications…</p></div>
    </section>

    <section class="wrap section" id="experience">
      <div class="section-heading">
        <h2>Experience</h2>
      </div>
      <div class="experience-groups" id="experience-list" aria-live="polite"><p class="data-status">Loading experience…</p></div>
    </section>

    <section class="wrap section" id="projects">
      <div class="section-heading">
        <h2>Projects</h2>
      </div>
      <div class="project-grid" id="project-list" aria-live="polite"><p class="data-status">Loading projects…</p></div>
    </section>

  </main>

  <footer>
    <div class="wrap footer-row"><span>© <span id="year"></span> <span data-site-name></span></span></div>
  </footer>
  <noscript><p class="wrap data-status">Enable JavaScript to load the content files for this site.</p></noscript>
  <script src="script.js" defer></script>
</body>
</html>
